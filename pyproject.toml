[project]
name = "amfly"
version = "0.1.0"
description = "Six instances of one connectome. Five in chambers, one at a dial."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pyarrow>=14",
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
# CUDA build must be installed separately, see README. CPU torch is ~90x
# slower here and is not a supported configuration for producing clips.
gpu = ["torch>=2.4"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["amfly*"]
